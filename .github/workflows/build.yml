                  } catch (Exception ignored) {}
              }

              private void setupMediaRecorder() {
                  try {
                      File dir = new File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "SignaturePro");
                      dir.mkdirs();
                      String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                      pendingVideoFile = new File(dir, "SIGPRO_4K_HLG10_" + stamp + ".mp4");
                      mediaRecorder = new MediaRecorder();
                      mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                      mediaRecorder.setVideoSource(MediaRecorder.VideoSource.SURFACE);
                      mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                      mediaRecorder.setOutputFile(pendingVideoFile.getAbsolutePath());
                      mediaRecorder.setVideoEncodingBitRate(120000000);
                      mediaRecorder.setVideoFrameRate(60);
                      mediaRecorder.setVideoSize(3840, 2160);
                      mediaRecorder.setVideoEncoder(MediaRecorder.VideoEncoder.HEVC);
                      mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                      mediaRecorder.setAudioEncodingBitRate(320000);
                      mediaRecorder.setAudioSamplingRate(48000);
                      mediaRecorder.prepare();
                  } catch (Exception e) {
                      setStatus("Recorder Init Error: " + e.getMessage());
                  }
              }

              private void toggleVideoRecording() {
                  if (!isRecordingVideo) {
                      try {
                          isRecordingVideo = true;
                          updateRepeatingPreview();
                          mediaRecorder.start();
                          shutterBtn.setText("STOP");
                          setStatus("REC 4K 10-Bit HLG (120 Mbps)...");
                      } catch (Exception e) {
                          isRecordingVideo = false;
                          setStatus("Video Start Error: " + e.getMessage());
                      }
                  } else {
                      try {
                          mediaRecorder.stop();
                          mediaRecorder.reset();
                          isRecordingVideo = false;
                          shutterBtn.setText("REC");
                          setStatus("Saved Video: " + pendingVideoFile.getName());
                      } catch (Exception e) {
                          isRecordingVideo = false;
                          setStatus("Video Stop Error: " + e.getMessage());
                      }
                  }
              }

              private void processLiveTelemetry(Image img) {
                  Image.Plane yPlane = img.getPlanes()[0];
                  ByteBuffer yBuf = yPlane.getBuffer();
                  int stride = yPlane.getRowStride();
                  int w = img.getWidth();
                  int h = img.getHeight();

                  int[] bins = new int[64];
                  final List< float[] > peaks = new ArrayList<>();
                  final List< float[] > zebras = new ArrayList<>();

                  int step = 6;
                  for (int y = step; y < h - step; y += step) {
                      int row = y * stride;
                      for (int x = step; x < w - step; x += step) {
                          int idx = row + x;
                          int l = yBuf.get(idx) & 0xFF;
                          bins[l >> 2]++;
                          if (enableZebras && l >= 242) {
                              zebras.add(new float[]{x / (float) w, y / (float) h});
                          }
                          if (enablePeaking) {
                              int left = yBuf.get(idx - 2) & 0xFF;
                              int right = yBuf.get(idx + 2) & 0xFF;
                              int up = yBuf.get(idx - 2 * stride) & 0xFF;
                              int down = yBuf.get(idx + 2 * stride) & 0xFF;
                              int gx = right - left;
                              int gy = down - up;
                              if (gx * gx + gy * gy > 3600) {
                                  peaks.add(new float[]{x / (float) w, y / (float) h});
                              }
                          }
                      }
                  }

                  int maxBin = 1;
                  for (int b : bins) if (b > maxBin) maxBin = b;
                  final float[] normBins = new float[64];
                  for (int i = 0; i < 64; i++) normBins[i] = bins[i] / (float) maxBin;

                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          System.arraycopy(normBins, 0, histogramBins, 0, 64);
                          peakPoints.clear();
                          peakPoints.addAll(peaks);
                          zebraPoints.clear();
                          zebraPoints.addAll(zebras);
                          if (overlayView != null) overlayView.invalidate();
                      }
                  });
              }

              private int luma(int argb) {
                  int r = (argb >> 16) & 0xFF;
                  int g = (argb >> 8) & 0xFF;
                  int b = argb & 0xFF;
                  return (r * 77 + g * 150 + b * 29) >> 8;
              }

              private void setStatus(final String msg) {
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          if (statusText != null) statusText.setText(msg);
                      }
                  });
              }

              private void refreshTelemetryHeader() {
                  if (telemetryText == null) return;
                  String focusStr = (focusDiopters <= 0.05f)
                      ? "AF-C"
                      : String.format(Locale.US, "%.2fD (%dcm)", focusDiopters, Math.round(100f / focusDiopters));
                  telemetryText.setText(String.format(Locale.US, "ISO %d  |  1/%ds  |  %s  |  %dK",
                      iso, shutterDenom, focusStr, kelvin));
              }

              private class OverlayView extends View {
                  private final Paint gridPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint peakPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint zebraPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint histBgPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint histBarPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  OverlayView(Context ctx) {
                      super(ctx);
                      gridPaint.setColor(Color.argb(55, 255, 255, 255));
                      gridPaint.setStrokeWidth(2f);
                      peakPaint.setColor(Color.argb(215, 0, 230, 118));
                      zebraPaint.setColor(Color.argb(190, 255, 23, 68));
                      histBgPaint.setColor(Color.argb(170, 0, 0, 0));
                      histBarPaint.setStrokeWidth(3f);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      float w = getWidth();
                      float h = getHeight();

                      c.drawLine(w / 3f, 0, w / 3f, h, gridPaint);
                      c.drawLine(2f * w / 3f, 0, 2f * w / 3f, h, gridPaint);
                      c.drawLine(0, h / 3f, w, h / 3f, gridPaint);
                      c.drawLine(0, 2f * h / 3f, w, 2f * h / 3f, gridPaint);

                      if (enableZebras) {
                          for (float[] pt : zebraPoints) {
                              c.drawCircle(pt[0] * w, pt[1] * h, 4.5f, zebraPaint);
                          }
                      }
                      if (enablePeaking) {
                          for (float[] pt : peakPoints) {
                              c.drawCircle(pt[0] * w, pt[1] * h, 3.5f, peakPaint);
                          }
                      }

                      float hw = dp(110);
                      float hh = dp(48);
                      float hx = w - hw - dp(12);
                      float hy = dp(12);
                      c.drawRect(hx, hy, hx + hw, hy + hh, histBgPaint);
                      float bw = hw / 64f;
                      for (int i = 0; i < 64; i++) {
                          histBarPaint.setColor(i > 58 ? Color.RED : Color.rgb(0, 230, 118));
                          float bh = histogramBins[i] * (hh - 6f);
                          c.drawLine(hx + i * bw, hy + hh - 3f, hx + i * bw, hy + hh - 3f - bh, histBarPaint);
                      }
                  }
              }

