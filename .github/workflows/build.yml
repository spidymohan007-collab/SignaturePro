name: Build SignaturePro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create 3 Core Project Files
        run: |
          mkdir -p app/src/main/java/com/signaturepro/camera

          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.signaturepro.camera"
              android:versionCode="1"
              android:versionName="1.0.0-SignaturePro">

              <uses-sdk android:minSdkVersion="31" android:targetSdkVersion="34" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.camera.raw" android:required="false" />
              <uses-feature android:name="android.hardware.camera.capability.manual_sensor" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="SignaturePro Cam"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

          echo 'plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.signaturepro.camera"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.signaturepro.camera"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-SignaturePro"
              }
          }' > app/build.gradle.kts

          echo 'package com.signaturepro.camera;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ImageFormat;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.SurfaceTexture;
          import android.graphics.Typeface;
          import android.hardware.camera2.CameraCaptureSession;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraDevice;
          import android.hardware.camera2.CameraManager;
          import android.hardware.camera2.CameraMetadata;
          import android.hardware.camera2.CaptureRequest;
          import android.hardware.camera2.DngCreator;
          import android.hardware.camera2.TotalCaptureResult;
          import android.hardware.camera2.params.OutputConfiguration;
          import android.hardware.camera2.params.RggbChannelVector;
          import android.hardware.camera2.params.SessionConfiguration;
          import android.hardware.camera2.params.StreamConfigurationMap;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.MediaRecorder;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Size;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.HapticFeedbackConstants;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;

          import java.io.File;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.nio.ByteBuffer;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static class LensProfile {
                  String logicalId;
                  String physicalId;
                  String label;
                  float focalMm;
                  float aperture;
                  float minFocusDiopters;
                  boolean isLossless2x;
                  boolean supportsRaw;
                  boolean supports50Mp;
                  boolean supports10Bit;
                  Rect activeRect = new Rect(0, 0, 4096, 3072);
                  Size maxRawSize;
                  Size maxJpegSize = new Size(4096, 3072);
              }

              private enum CaptureMode {
                  PRO_RAW_16("16-BIT RAW"),
                  REMOSAIC_50MP("50MP HI-RES"),
                  TELEMACRO_STACK("14CM STACK (10x)"),
                  VIDEO_10BIT_HLG("4K 10-BIT HLG");

                  final String title;
                  CaptureMode(String t) { this.title = t; }
              }

              private CameraManager cameraManager;
              private HandlerThread cameraThread;
              private Handler cameraHandler;
              private final Executor cameraExecutor = Executors.newSingleThreadExecutor();
              private final Executor ioExecutor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private CameraDevice cameraDevice;
              private CameraCaptureSession captureSession;
              private CameraCharacteristics activeCharacteristics;

              private ImageReader jpegReader;
              private ImageReader rawReader;
              private ImageReader analyzerReader;
              private MediaRecorder mediaRecorder;
              private File pendingVideoFile;

              private final List<LensProfile> lenses = new ArrayList<>();
              private LensProfile selectedLens;
              private CaptureMode selectedMode = CaptureMode.PRO_RAW_16;

              private int iso = 200;
              private int shutterDenom = 250;
              private float focusDiopters = 0.0f;
              private int kelvin = 5500;
              private boolean enablePeaking = true;
              private boolean enableZebras = true;
              private boolean isRecordingVideo = false;

              private SurfaceTexture activeSurfaceTexture;
              private TextView statusText;
              private TextView telemetryText;
              private Button shutterBtn;
              private OverlayView overlayView;
              private final List<Button> lensButtons = new ArrayList<>();
              private final List<Button> modeButtons = new ArrayList<>();

              private final float[] histogramBins = new float[64];
              private final List< float[] > peakPoints = new ArrayList<>();
              private final List< float[] > zebraPoints = new ArrayList<>();
              private final List<Bitmap> burstBitmaps = new ArrayList<>();
              private int expectedBurstCount = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  cameraManager = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                  cameraThread = new HandlerThread("SignatureProThread");
                  cameraThread.start();
                  cameraHandler = new Handler(cameraThread.getLooper());

                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED ||
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO}, 101);
                  } else {
                      initHardwareAndUi();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      initHardwareAndUi();
                  }
              }

              private void initHardwareAndUi() {
                  enumerateSignatureLenses();
                  selectedLens = lenses.get(0);
                  for (LensProfile lp : lenses) {
                      if (!lp.isLossless2x && lp.focalMm >= 2.8f && lp.focalMm <= 6.0f) {
                          selectedLens = lp;
                          break;
                      }
                  }
                  setContentView(buildProCinemaUi());
                  refreshTelemetryHeader();
              }

              private void enumerateSignatureLenses() {
                  lenses.clear();
                  try {
                      for (String logicalId : cameraManager.getCameraIdList()) {
                          CameraCharacteristics chars = cameraManager.getCameraCharacteristics(logicalId);
                          Integer facing = chars.get(CameraCharacteristics.LENS_FACING);
                          if (facing == null || facing != CameraMetadata.LENS_FACING_BACK) continue;

                          Set<String> physIds = chars.getPhysicalCameraIds();
                          List<String> targetIds = new ArrayList<>();
                          if (physIds != null && !physIds.isEmpty()) {
                              targetIds.addAll(physIds);
                          } else {
                              targetIds.add(logicalId);
                          }

                          for (String pid : targetIds) {
                              CameraCharacteristics pChars = cameraManager.getCameraCharacteristics(pid);
                              float[] focals = pChars.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS);
                              float[] apertures = pChars.get(CameraCharacteristics.LENS_INFO_AVAILABLE_APERTURES);
                              Float minFocus = pChars.get(CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE);
                              int[] caps = pChars.get(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES);

                              boolean hasRaw = false;
                              boolean has50Mp = false;
                              boolean has10Bit = false;
                              if (caps != null) {
                                  for (int c : caps) {
                                      if (c == CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_RAW) hasRaw = true;
                                      if (c == 16) has50Mp = true;
                                      if (c == 18) has10Bit = true;
                                  }
                              }

                              StreamConfigurationMap map = pChars.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP);
                              Size maxRaw = null;
                              Size maxJpeg = new Size(4096, 3072);
                              if (map != null) {
                                  if (hasRaw) maxRaw = getLargestSize(map.getOutputSizes(ImageFormat.RAW_SENSOR));
                                  Size j = getLargestSize(map.getOutputSizes(ImageFormat.JPEG));
                                  if (j != null) maxJpeg = j;
                              }

                              float focal = (focals != null && focals.length > 0) ? focals[0] : 4.5f;
                              float ap = (apertures != null && apertures.length > 0) ? apertures[0] : 1.8f;

                              LensProfile lp = new LensProfile();
                              lp.logicalId = logicalId;
                              lp.physicalId = pid.equals(logicalId) ? null : pid;
                              lp.focalMm = focal;
                              lp.aperture = ap;
                              lp.minFocusDiopters = (minFocus != null) ? minFocus : 7.14f;
                              lp.supportsRaw = hasRaw;
                              lp.supports50Mp = has50Mp;
                              lp.supports10Bit = has10Bit;
                              Rect rect = pChars.get(CameraCharacteristics.SENSOR_INFO_ACTIVE_ARRAY_SIZE);
                              if (rect != null) lp.activeRect = rect;
                              lp.maxRawSize = maxRaw;
                              lp.maxJpegSize = maxJpeg;

                              if (focal < 2.8f) lp.label = "12mm JNS (0.5x)";
                              else if (focal <= 6.0f) lp.label = "24mm LYT-828 (1x)";
                              else lp.label = "71mm LYT-600 (3x)";
                              lenses.add(lp);

                              if (focal >= 2.8f && focal <= 6.0f) {
                                  LensProfile crop2x = new LensProfile();
                                  crop2x.logicalId = lp.logicalId;
                                  crop2x.physicalId = lp.physicalId;
                                  crop2x.focalMm = lp.focalMm * 1.5f;
                                  crop2x.aperture = lp.aperture;
                                  crop2x.minFocusDiopters = lp.minFocusDiopters;
                                  crop2x.isLossless2x = true;
                                  crop2x.supportsRaw = lp.supportsRaw;
                                  crop2x.supports50Mp = lp.supports50Mp;
                                  crop2x.supports10Bit = lp.supports10Bit;
                                  crop2x.activeRect = lp.activeRect;
                                  crop2x.maxRawSize = lp.maxRawSize;
                                  crop2x.maxJpegSize = lp.maxJpegSize;
                                  crop2x.label = "48mm Lossless (2x)";
                                  lenses.add(crop2x);
                              }
                          }
                          break;
                      }
                  } catch (Exception ignored) {}

                  if (lenses.isEmpty()) {
                      LensProfile fallback = new LensProfile();
                      fallback.logicalId = "0";
                      fallback.label = "24mm LYT-828 (1x)";
                      fallback.focalMm = 4.7f;
                      fallback.aperture = 1.6f;
                      fallback.minFocusDiopters = 7.14f;
                      fallback.supportsRaw = true;
                      lenses.add(fallback);
                  }

                  Collections.sort(lenses, new Comparator<LensProfile>() {
                      @Override
                      public int compare(LensProfile a, LensProfile b) {
                          return Float.compare(a.focalMm, b.focalMm);
                      }
                  });
              }

              private Size getLargestSize(Size[] sizes) {
                  if (sizes == null || sizes.length == 0) return null;
                  Size best = sizes[0];
                  for (Size s : sizes) {
                      if ((long) s.getWidth() * s.getHeight() > (long) best.getWidth() * best.getHeight()) {
                          best = s;
                      }
                  }
                  return best;
              }

              private void startCameraSession() {
                  if (activeSurfaceTexture == null || selectedLens == null) return;
                  closeCameraSession();
                  try {
                      String charId = (selectedLens.physicalId != null) ? selectedLens.physicalId : selectedLens.logicalId;
                      activeCharacteristics = cameraManager.getCameraCharacteristics(charId);

                      cameraManager.openCamera(selectedLens.logicalId, new CameraDevice.StateCallback() {
                          @Override
                          public void onOpened(CameraDevice device) {
                              cameraDevice = device;
                              configureStreams(device);
                          }
                          @Override
                          public void onDisconnected(CameraDevice device) {
                              device.close();
                              cameraDevice = null;
                          }
                          @Override
                          public void onError(CameraDevice device, int error) {
                              device.close();
                              cameraDevice = null;
                              setStatus("Camera Error: " + error);
                          }
                      }, cameraHandler);
                  } catch (Exception e) {
                      setStatus("Open Error: " + e.getMessage());
                  }
              }

              private OutputConfiguration wrapOutput(Surface s, boolean try10Bit) {
                  OutputConfiguration cfg = new OutputConfiguration(s);
                  if (selectedLens.physicalId != null) {
                      cfg.setPhysicalCameraId(selectedLens.physicalId);
                  }
                  if (try10Bit && selectedLens.supports10Bit && Build.VERSION.SDK_INT >= 33) {
                      try {
                          Method m = OutputConfiguration.class.getMethod("setDynamicRangeProfile", long.class);
                          m.invoke(cfg, 2L);
                      } catch (Exception ignored) {}
                  }
                  return cfg;
              }

              private void configureStreams(CameraDevice device) {
                  try {
                      activeSurfaceTexture.setDefaultBufferSize(1920, 1080);
                      final Surface previewSurface = new Surface(activeSurfaceTexture);
                      List<OutputConfiguration> outputs = new ArrayList<>();

                      boolean isVideo = (selectedMode == CaptureMode.VIDEO_10BIT_HLG);
                      outputs.add(wrapOutput(previewSurface, isVideo));

                      analyzerReader = ImageReader.newInstance(640, 480, ImageFormat.YUV_420_888, 2);
                      analyzerReader.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                          @Override
                          public void onImageAvailable(ImageReader reader) {
                              Image img = reader.acquireLatestImage();
                              if (img != null) {
                                  processLiveTelemetry(img);
                                  img.close();
                              }
                          }
                      }, cameraHandler);
                      outputs.add(wrapOutput(analyzerReader.getSurface(), false));

                      if (isVideo) {
                          setupMediaRecorder();
                          if (mediaRecorder != null) {
                              outputs.add(wrapOutput(mediaRecorder.getSurface(), true));
                          }
                      } else {
                          Size jSize = (selectedMode == CaptureMode.TELEMACRO_STACK) ? new Size(1920, 1440) : selectedLens.maxJpegSize;
                          jpegReader = ImageReader.newInstance(jSize.getWidth(), jSize.getHeight(), ImageFormat.JPEG, 12);
                          jpegReader.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                              @Override
                              public void onImageAvailable(ImageReader reader) {
                                  Image img = reader.acquireNextImage();
                                  if (img != null) handleJpegFrame(img);
                              }
                          }, cameraHandler);
                          outputs.add(wrapOutput(jpegReader.getSurface(), false));

                          if (selectedMode == CaptureMode.PRO_RAW_16 && selectedLens.supportsRaw && selectedLens.maxRawSize != null) {
                              rawReader = ImageReader.newInstance(
                                  selectedLens.maxRawSize.getWidth(),
                                  selectedLens.maxRawSize.getHeight(),
                                  ImageFormat.RAW_SENSOR, 4
                              );
                              outputs.add(wrapOutput(rawReader.getSurface(), false));
                          }
                      }

                      SessionConfiguration sessionCfg = new SessionConfiguration(
                          SessionConfiguration.SESSION_REGULAR,
                          outputs,
                          cameraExecutor,
                          new CameraCaptureSession.StateCallback() {
                              @Override
                              public void onConfigured(CameraCaptureSession session) {
                                  captureSession = session;
                                  setStatus("Locked: " + selectedLens.label + " | " + selectedMode.title);
                                  updateRepeatingPreview();
                              }
                              @Override
                              public void onConfigureFailed(CameraCaptureSession session) {
                                  setStatus("Stream Config Failed");
                              }
                          }
                      );
                      device.createCaptureSession(sessionCfg);
                  } catch (Exception e) {
                      setStatus("Stream Error: " + e.getMessage());
                  }
              }

              private void updateRepeatingPreview() {
                  if (cameraDevice == null || captureSession == null || activeSurfaceTexture == null) return;
                  try {
                      int template = (selectedMode == CaptureMode.VIDEO_10BIT_HLG)
                          ? CameraDevice.TEMPLATE_RECORD : CameraDevice.TEMPLATE_PREVIEW;
                      CaptureRequest.Builder b = cameraDevice.createCaptureRequest(template);
                      b.addTarget(new Surface(activeSurfaceTexture));
                      if (analyzerReader != null) b.addTarget(analyzerReader.getSurface());
                      if (isRecordingVideo && mediaRecorder != null) b.addTarget(mediaRecorder.getSurface());

                      applyManualProParameters(b, focusDiopters);
                      captureSession.setRepeatingRequest(b.build(), null, cameraHandler);
                  } catch (Exception e) {
                      setStatus("Preview Error: " + e.getMessage());
                  }
              }

              private void applyManualProParameters(CaptureRequest.Builder b, float fDist) {
                  long shutterNs = 1000000000L / Math.max(1, shutterDenom);
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO);
                  b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_OFF);
                  b.set(CaptureRequest.SENSOR_SENSITIVITY, iso);
                  b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, shutterNs);

                  if (fDist <= 0.05f) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_PICTURE);
                  } else {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_OFF);
                      b.set(CaptureRequest.LENS_FOCUS_DISTANCE, fDist);
                  }

                  b.set(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CameraMetadata.LENS_OPTICAL_STABILIZATION_MODE_ON);
                  b.set(CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE, CameraMetadata.CONTROL_VIDEO_STABILIZATION_MODE_OFF);

                  b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_OFF);
                  b.set(CaptureRequest.COLOR_CORRECTION_MODE, CameraMetadata.COLOR_CORRECTION_MODE_TRANSFORM_MATRIX);
                  float norm = (kelvin - 5500f) / 4500f;
                  float rG = Math.max(1.0f, Math.min(3.2f, 1.85f + norm * 0.65f));
                  float bG = Math.max(1.0f, Math.min(3.2f, 1.85f - norm * 0.65f));
                  b.set(CaptureRequest.COLOR_CORRECTION_GAINS, new RggbChannelVector(rG, 1.0f, 1.0f, bG));

                  if (selectedLens.isLossless2x) {
                      Rect r = selectedLens.activeRect;
                      int cw = r.width() / 2;
                      int ch = r.height() / 2;
                      int left = r.left + (r.width() - cw) / 2;
                      int top = r.top + (r.height() - ch) / 2;
                      b.set(CaptureRequest.SCALER_CROP_REGION, new Rect(left, top, left + cw, top + ch));
                  }
              }

              private void triggerCapture() {
                  if (cameraDevice == null || captureSession == null) return;
                  try {
                      if (selectedMode == CaptureMode.VIDEO_10BIT_HLG) {
                          toggleVideoRecording();
                      } else if (selectedMode == CaptureMode.TELEMACRO_STACK) {
                          expectedBurstCount = 10;
                          burstBitmaps.clear();
                          setStatus("Shooting 10-Frame 14cm Telemacro Stack...");
                          List<CaptureRequest> burst = new ArrayList<>();
                          float startD = (focusDiopters > 1.0f) ? focusDiopters : 7.14f;
                          float endD = Math.max(0.5f, startD - 2.6f);
                          float step = (endD - startD) / 9.0f;

                          for (int i = 0; i < 10; i++) {
                              CaptureRequest.Builder b = cameraDevice.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE);
                              if (jpegReader != null) b.addTarget(jpegReader.getSurface());
                              applyManualProParameters(b, startD + step * i);
                              burst.add(b.build());
                          }
                          captureSession.captureBurst(burst, null, cameraHandler);
                      } else {
                          setStatus("Capturing " + selectedMode.title + "...");
                          CaptureRequest.Builder b = cameraDevice.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE);
                          if (jpegReader != null) b.addTarget(jpegReader.getSurface());
                          if (selectedMode == CaptureMode.PRO_RAW_16 && rawReader != null) {
                              b.addTarget(rawReader.getSurface());
                          }
                          b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_OFF);
                          b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_OFF);
                          b.set(CaptureRequest.STATISTICS_LENS_SHADING_MAP_MODE, CameraMetadata.STATISTICS_LENS_SHADING_MAP_MODE_ON);
                          b.set(CaptureRequest.HOT_PIXEL_MODE, CameraMetadata.HOT_PIXEL_MODE_HIGH_QUALITY);
                          applyManualProParameters(b, focusDiopters);

                          captureSession.capture(b.build(), new CameraCaptureSession.CaptureCallback() {
                              @Override
                              public void onCaptureCompleted(CameraCaptureSession s, CaptureRequest req, TotalCaptureResult res) {
                                  if (selectedMode == CaptureMode.PRO_RAW_16 && rawReader != null && activeCharacteristics != null) {
                                      Image rawImg = rawReader.acquireLatestImage();
                                      if (rawImg != null) saveRawDng(rawImg, activeCharacteristics, res);
                                  }
                              }
                          }, cameraHandler);
                      }
                  } catch (Exception e) {
                      setStatus("Capture Error: " + e.getMessage());
                  }
              }

              private void handleJpegFrame(Image img) {
                  ByteBuffer buf = img.getPlanes()[0].getBuffer();
                  final byte[] bytes = new byte[buf.remaining()];
                  buf.get(bytes);
                  img.close();

                  if (selectedMode == CaptureMode.TELEMACRO_STACK) {
                      Bitmap bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bmp != null) {
                          burstBitmaps.add(bmp);
                          setStatus("Stack Frame " + burstBitmaps.size() + "/" + expectedBurstCount);
                          if (burstBitmaps.size() >= expectedBurstCount) {
                              final List<Bitmap> copy = new ArrayList<>(burstBitmaps);
                              burstBitmaps.clear();
                              ioExecutor.execute(new Runnable() {
                                  @Override
                                  public void run() { mergeFocusStackLaplacian(copy); }
                              });
                          }
                      }
                  } else {
                      ioExecutor.execute(new Runnable() {
                          @Override
                          public void run() {
                              String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                              String name = "SIGPRO_" + selectedMode.name() + "_" + stamp + ".jpg";
                              saveToMediaStore(bytes, name, "image/jpeg");
                              setStatus("Saved " + name + " to DCIM/SignaturePro");
                          }
                      });
                  }
              }

              private void mergeFocusStackLaplacian(List<Bitmap> frames) {
                  setStatus("Merging 10-Frame Telemacro Focus Stack...");
                  int w = frames.get(0).getWidth();
                  int h = frames.get(0).getHeight();
                  int total = w * h;
                  int[] bestPixels = new int[total];
                  int[] bestContrast = new int[total];
                  for (int i = 0; i < total; i++) bestContrast[i] = -1;
                  int[] rowBuf = new int[total];

                  for (Bitmap frame : frames) {
                      frame.getPixels(rowBuf, 0, w, 0, 0, w, h);
                      for (int y = 1; y < h - 1; y++) {
                          int rowOff = y * w;
                          for (int x = 1; x < w - 1; x++) {
                              int idx = rowOff + x;
                              int c = luma(rowBuf[idx]);
                              int l = luma(rowBuf[idx - 1]);
                              int r = luma(rowBuf[idx + 1]);
                              int u = luma(rowBuf[idx - w]);
                              int d = luma(rowBuf[idx + w]);
                              int energy = Math.abs(4 * c - l - r - u - d);
                              if (energy > bestContrast[idx]) {
                                  bestContrast[idx] = energy;
                                  bestPixels[idx] = rowBuf[idx];
                              }
                          }
                      }
                  }

                  Bitmap merged = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  merged.setPixels(bestPixels, 0, w, 0, 0, w, h);
                  String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                  String name = "SIGPRO_MACRO_STACK10_" + stamp + ".jpg";
                  try {
                      ContentResolver resolver = getContentResolver();
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_DCIM + "/SignaturePro");
                      Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (uri != null) {
                          OutputStream out = resolver.openOutputStream(uri);
                          if (out != null) {
                              merged.compress(Bitmap.CompressFormat.JPEG, 98, out);
                              out.close();
                          }
                      }
                  } catch (Exception ignored) {}
                  for (Bitmap b : frames) b.recycle();
                  merged.recycle();
                  setStatus("Focus Stack Saved: " + name);
              }

              private void saveRawDng(final Image rawImg, final CameraCharacteristics chars, final TotalCaptureResult res) {
                  ioExecutor.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                              String name = "SIGPRO_16BIT_" + stamp + ".dng";
                              ContentResolver resolver = getContentResolver();
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                              v.put(MediaStore.Images.Media.MIME_TYPE, "image/x-adobe-dng");
                              v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_DCIM + "/SignaturePro");
                              Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                              if (uri != null) {
                                  OutputStream out = resolver.openOutputStream(uri);
                                  if (out != null) {
                                      DngCreator dng = new DngCreator(chars, res);
                                      dng.writeImage(out, rawImg);
                                      dng.close();
                                      out.close();
                                  }
                              }
                              setStatus("Saved 16-Bit RAW: " + name);
                          } catch (Exception e) {
                              setStatus("DNG Error: " + e.getMessage());
                          } finally {
                              rawImg.close();
                          }
                      }
                  });
              }

              private void saveToMediaStore(byte[] bytes, String name, String mime) {
                  try {
                      ContentResolver resolver = getContentResolver();
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                      v.put(MediaStore.Images.Media.MIME_TYPE, mime);
                      v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_DCIM + "/SignaturePro");
                      Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (uri != null) {
                          OutputStream out = resolver.openOutputStream(uri);
