              private LinearLayout buildSliderRow(String title, int max, int init, SeekBar.OnSeekBarChangeListener listener) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  TextView tv = new TextView(this);
                  tv.setText(title);
                  tv.setTextColor(Color.LTGRAY);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);
                  tv.setTypeface(Typeface.MONOSPACE);
                  row.addView(tv, new LinearLayout.LayoutParams(dp(64), ViewGroup.LayoutParams.WRAP_CONTENT));

                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max);
                  sb.setProgress(init);
                  sb.setOnSeekBarChangeListener(listener);
                  row.addView(sb, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  return row;
              }

              private void updateSelectionColors() {
                  for (int i = 0; i < lensButtons.size() && i < lenses.size(); i++) {
                      boolean sel = (lenses.get(i) == selectedLens);
                      lensButtons.get(i).setBackgroundColor(sel ? Color.rgb(255, 193, 7) : Color.rgb(40, 40, 48));
                      lensButtons.get(i).setTextColor(sel ? Color.BLACK : Color.WHITE);
                  }
                  CaptureMode[] modes = CaptureMode.values();
                  for (int i = 0; i < modeButtons.size() && i < modes.length; i++) {
                      boolean sel = (modes[i] == selectedMode);
                      modeButtons.get(i).setBackgroundColor(sel ? Color.rgb(0, 230, 118) : Color.rgb(32, 32, 38));
                      modeButtons.get(i).setTextColor(sel ? Color.BLACK : Color.LTGRAY);
                  }
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }

              private void closeCameraSession() {
                  try {
                      if (captureSession != null) { captureSession.close(); captureSession = null; }
                      if (cameraDevice != null) { cameraDevice.close(); cameraDevice = null; }
                      if (jpegReader != null) { jpegReader.close(); jpegReader = null; }
                      if (rawReader != null) { rawReader.close(); rawReader = null; }
                      if (analyzerReader != null) { analyzerReader.close(); analyzerReader = null; }
                      if (mediaRecorder != null) { mediaRecorder.release(); mediaRecorder = null; }
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  closeCameraSession();
                  if (cameraThread != null) cameraThread.quitSafely();
                  super.onDestroy();
              }
