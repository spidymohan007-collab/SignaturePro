      - name: Upload 3 Core Project Files
        uses: actions/upload-artifact@v4
        with:
          name: SignaturePro-3-Core-Files
          path: |
            app/src/main/AndroidManifest.xml
            app/build.gradle.kts
            app/src/main/java/com/signaturepro/camera/MainActivity.java

      - name: Compile and Sign SignaturePro APK
        run: |
          set -ex
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR=$(find "$SDK/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$SDK/build-tools" -name "aapt2" 2>/dev/null | sort -V | tail -n 1)
          BUILD_TOOLS=$(dirname "$AAPT2")
          mkdir -p build/gen build/obj app/build/outputs/apk/debug
          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk --manifest app/src/main/AndroidManifest.xml -I "$ANDROID_JAR" --java build/gen
          javac -source 11 -target 11 -cp "$ANDROID_JAR" -d build/obj app/src/main/java/com/signaturepro/camera/MainActivity.java
          jar cf build/classes.jar -C build/obj .
          "$BUILD_TOOLS/d8" --min-api 31 --lib "$ANDROID_JAR" --output build/ build/classes.jar
          cd build && zip -uj unaligned.apk classes.dex && cd ..
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SignaturePro,O=Motorola,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/debug/SignaturePro-Motorola.apk build/aligned.apk

      - name: Upload Installable SignaturePro APK
        uses: actions/upload-artifact@v4
        with:
          name: SignaturePro-Motorola-APK
          path: app/build/outputs/apk/debug/SignaturePro-Motorola.apk
